# Data: /data (bare repos + worktrees) is a host bind mount (default ./.mas) so the verifier service on the host can read
# the exact integration commits and promote refs; workers/orchestrator see it as /data. Single host by design.
# Networks: `backend` is internal (no egress). Workers and the orchestrator live only there — they can reach
# Postgres, nothing else (invariant I-11; antipatterns A8/B12 containment). Postgres also sits on the default
# network so the host can reach it on the published port.
networks:
  backend:
    internal: true
  frontend: {}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas
      POSTGRES_DB: mas
    ports:
      - "${MAS_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend, frontend]

  # Deterministic control plane. Ticks every open run in its pool: readiness, reaper, budgets, verifier stage.
  # Shares the workspace volume so it can promote run/<run>/integration on PASS.
  orchestrator:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAS_DATABASE_URL: postgresql://mas:mas@postgres:5432/mas
      MAS_POOL: ${MAS_POOL:-default}
      # Planner model (step 11), reached only through the gateway like the workers' model: openai:<allowed name>.
      MAS_MODEL_PLANNER: ${MAS_MODEL_PLANNER:-}
      MAS_MODEL_PRICES: ${MAS_MODEL_PRICES:-}
      MAS_OPENAI_BASE_URL: http://gateway:8080/v1
      MAS_OPENAI_API_KEY: ${MAS_GATEWAY_TOKEN:-mas-gateway}
    # The hardened orchestrator has no Docker: it moves runs to VERIFYING and leaves them for the verifier service
    # (`mas verify --watch` on the host, which has Docker). Never mount docker.sock here. `--verifier stub` = test mode.
    # --planner: how ad-hoc goals (`mas submit --goal`) get planned: none | fake (offline double) | llm (MAS_MODEL_PLANNER).
    command: ["mas", "orchestrate", "--watch", "--verifier", "${MAS_ORCH_VERIFIER:-external}", "--parallel", "4", "--planner", "${MAS_ORCH_PLANNER:-none}"]
    volumes:
      - ${MAS_DATA_DIR:-./.mas}:/data
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Disposable workers. Scale with: docker compose up -d --scale worker=3
  # Non-root, read-only rootfs, no egress, acceptance/ read-only; the only writable places are /data (worktrees) and /tmp.
  # The one process with a vendor key and egress: backend (workers reach it) + frontend (it reaches the vendor).
  # Workers stay on the internal backend network. Default upstream is the offline demo double; set
  # MAS_GATEWAY_UPSTREAM=anthropic:<model> (+ ANTHROPIC_API_KEY in your shell) for a real model.
  gateway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAS_GATEWAY_UPSTREAM: ${MAS_GATEWAY_UPSTREAM:-fake:builder}
      MAS_GATEWAY_MODELS: ${MAS_GATEWAY_MODELS:-builder}
      MAS_GATEWAY_TOKEN: ${MAS_GATEWAY_TOKEN:-mas-gateway}
      MAS_GATEWAY_LISTEN: 0.0.0.0:8080
      # Vendor credentials, valueless on purpose: Compose resolves each from the shell or ./.env and OMITS it when it
      # is not set anywhere (`${VAR:-}` would instead define an empty one, which an SDK may read as a blank credential).
      # Every name `mas doctor --require-live` accepts must appear here (mas/cli.py VENDOR_KEY_NAMES): otherwise
      # preflight passes on a credential the gateway — the only process that talks to the vendor — never receives.
      ANTHROPIC_API_KEY:
      ANTHROPIC_AUTH_TOKEN:
      OPENAI_API_KEY:
      MAS_OPENAI_API_KEY:
      MAS_OPENAI_BASE_URL: ${MAS_UPSTREAM_OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Request shape of the real upstream = the same settings the direct (in-process) path reads, so live and
      # distributed evidence are produced under one configuration (defaults mirror mas/config.py).
      MAS_ANTHROPIC_THINKING: ${MAS_ANTHROPIC_THINKING:-1}
      MAS_ANTHROPIC_EFFORT: ${MAS_ANTHROPIC_EFFORT:-}
      MAS_ANTHROPIC_FALLBACKS: ${MAS_ANTHROPIC_FALLBACKS:-}
      MAS_PROVIDER_TIMEOUT_S: ${MAS_PROVIDER_TIMEOUT_S:-600}
      MAS_PROVIDER_MAX_RETRIES: ${MAS_PROVIDER_MAX_RETRIES:-2}
    command: ["mas", "gateway"]
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAS_DATABASE_URL: postgresql://mas:mas@postgres:5432/mas
      MAS_WORKER_CAPABILITIES: architecture,implementation,testing,integration,solve
      MAS_POOL: ${MAS_POOL:-default}
      MAS_WORKSPACE: git
      # Step 9: model + prices are config. The backend network has NO egress, so a real provider is only reachable
      # through an in-cluster model gateway (point MAS_OPENAI_BASE_URL at it) — never put vendor keys in this file.
      MAS_MODEL_WORKER: ${MAS_MODEL_WORKER:-openai:builder}   # openai:<name> served by the gateway (fake:builder = offline demo)
      MAS_MODEL_PRICES: ${MAS_MODEL_PRICES:-}
      MAS_OPENAI_BASE_URL: http://gateway:8080/v1              # the only model endpoint a worker can reach
      MAS_OPENAI_API_KEY: ${MAS_GATEWAY_TOKEN:-mas-gateway}
      # Command tools: no docker.sock in here — requests go through Postgres to `mas execute --watch` on the host.
      MAS_EXEC_BACKEND: ${MAS_EXEC_BACKEND:-remote}
    command: ["mas", "worker", "--agent", "${MAS_WORKER_AGENT:-stub}", "--stub-sleep", "${MAS_STUB_SLEEP:-0.5}"]
    volumes:
      - ${MAS_DATA_DIR:-./.mas}:/data
      - ./acceptance:/app/acceptance:ro
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
