# Data: /data (bare repos + worktrees) is a host bind mount (default ./.mas) so the verifier service on the host can read
# the exact integration commits and promote refs; workers/orchestrator see it as /data. Single host by design.
# Networks: `backend` is internal (no egress). Workers and the orchestrator live only there — they can reach
# Postgres, nothing else (invariant I-11; antipatterns A8/B12 containment). Postgres also sits on the default
# network so the host can reach it on the published port.
networks:
  backend:
    internal: true
  frontend: {}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: mas
      POSTGRES_DB: mas
    ports:
      - "${MAS_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend, frontend]

  # Deterministic control plane. Ticks every open run in its pool: readiness, reaper, budgets, verifier stage.
  # Shares the workspace volume so it can promote run/<run>/integration on PASS.
  orchestrator:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAS_DATABASE_URL: postgresql://mas:mas@postgres:5432/mas
      MAS_POOL: ${MAS_POOL:-default}
    # The hardened orchestrator has no Docker: it moves runs to VERIFYING and leaves them for the verifier service
    # (`mas verify --watch` on the host, which has Docker). Never mount docker.sock here. `--verifier stub` = test mode.
    command: ["mas", "orchestrate", "--watch", "--verifier", "${MAS_ORCH_VERIFIER:-external}", "--parallel", "4"]
    volumes:
      - ${MAS_DATA_DIR:-./.mas}:/data
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Disposable workers. Scale with: docker compose up -d --scale worker=3
  # Non-root, read-only rootfs, no egress, acceptance/ read-only; the only writable places are /data (worktrees) and /tmp.
  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAS_DATABASE_URL: postgresql://mas:mas@postgres:5432/mas
      MAS_WORKER_CAPABILITIES: architecture,implementation,testing,integration,solve
      MAS_POOL: ${MAS_POOL:-default}
      MAS_WORKSPACE: git
      # Step 9: model + prices are config. The backend network has NO egress, so a real provider is only reachable
      # through an in-cluster model gateway (point MAS_OPENAI_BASE_URL at it) — never put vendor keys in this file.
      MAS_MODEL_WORKER: ${MAS_MODEL_WORKER:-}
      MAS_MODEL_PRICES: ${MAS_MODEL_PRICES:-}
      MAS_OPENAI_BASE_URL: ${MAS_OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Command tools: no docker.sock in here — requests go through Postgres to `mas execute --watch` on the host.
      MAS_EXEC_BACKEND: ${MAS_EXEC_BACKEND:-remote}
    command: ["mas", "worker", "--agent", "${MAS_WORKER_AGENT:-stub}", "--stub-sleep", "${MAS_STUB_SLEEP:-0.5}"]
    volumes:
      - ${MAS_DATA_DIR:-./.mas}:/data
      - ./acceptance:/app/acceptance:ro
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
