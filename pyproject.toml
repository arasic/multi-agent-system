[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas"
version = "0.0.1"
description = "A small distributed multi-agent runtime: LLM planner, deterministic orchestrator, disposable workers, immutable artifacts, external verification."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]

[project.scripts]
mas = "mas.cli:main"

[tool.setuptools.packages.find]
include = ["mas*"]

[tool.setuptools.package-data]
"mas.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-ra"
markers = [
    "db: requires a reachable PostgreSQL (MAS_DATABASE_URL)",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
