[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas"
version = "0.0.1"
description = "A small distributed multi-agent runtime: LLM planner, deterministic orchestrator, disposable workers, immutable artifacts, external verification."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",   # `-n auto`: every worker process gets its own mas_test_<pid> database (tests/conftest.py)
    "ruff>=0.5",
]
# Real model providers (roadmap step 9). The core, the tests and the fake provider need none of this.
llm = [
    "anthropic>=0.60",
]

[project.scripts]
mas = "mas.cli:main"

[tool.setuptools.packages.find]
include = ["mas*"]

[tool.setuptools.package-data]
"mas.db" = ["migrations/*.sql"]
"mas.providers" = ["fake_assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv", ".mas", "build", "dist"]  # tests/fixtures/** belong to sandboxed fixture apps, not to us
timeout = 120
addopts = "-ra"
markers = [
    "db: requires a reachable PostgreSQL (MAS_DATABASE_URL)",
    "docker: needs the Docker daemon (sandboxes / the verifier image); auto-applied to tests using `verifier_image`",
]
# Tiers (scripts/test.py): unit = -m "not db and not docker" (seconds) · core = -m "not docker" (~1 min with -n auto)
# · full = everything (~2 min with -n auto, 5-7 min serial) · gate = scripts/stress_step6.py (~13 min).

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
