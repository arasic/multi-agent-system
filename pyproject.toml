[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas"
version = "0.0.1"
description = "A small distributed multi-agent runtime: LLM planner, deterministic orchestrator, disposable workers, immutable artifacts, external verification."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]
# Real model providers (roadmap step 9). The core, the tests and the fake provider need none of this.
llm = [
    "anthropic>=0.60",
]

[project.scripts]
mas = "mas.cli:main"

[tool.setuptools.packages.find]
include = ["mas*"]

[tool.setuptools.package-data]
"mas.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv", ".mas", "build", "dist"]  # tests/fixtures/** belong to sandboxed fixture apps, not to us
timeout = 120
addopts = "-ra"
markers = [
    "db: requires a reachable PostgreSQL (MAS_DATABASE_URL)",
    "docker: executes the hardened acceptance sandbox using Docker",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
